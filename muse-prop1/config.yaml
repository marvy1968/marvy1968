# Muse Prop1 — config v1.2 (4-sport)
name: muse-prop1
# Change any threshold = new test. Do not silently tweak mid-test.
sports:
  - nfl
  - ncaaf_top30
  - ncaab
  - ncaaw
odds_source: propline  # PropLine (Odds API) only — NO Bovada, no sportsbook.
# Bookmaker allowlist for PropLine prices. Empty = median price across all
# non-Bovada bookmakers PropLine returns. Set to ["kalshi", "polymarket"] to
# restrict to Kalshi/Polymarket ONLY once PropLine's keys for them are
# verified against a real response (NOT verified as of 2026-11-10 — do not
# assume the keys). "bovada" can never be admitted (propline.py enforces it).
odds_bookmakers: []

# Live PropLine pace — FREE TIER (2026-11-10 rework, Grok flaw 3).
# One bulk call per sport per poll (whole slate + player props in one call),
# and a sport is polled ONLY while it has live games (ESPN scoreboard is
# checked first — ESPN is free/keyless, so the gate costs no quota).
# Polling is 300s per sport (was 150s football / 180s basketball). The old
# config comment claimed a 1,000/day free tier; Grok's review says PropLine's
# free tier is MONTHLY (1,000 calls/month). At 300s, a worst-case Sunday
# (NFL ~14h + NCAAB ~13h + NCAAW ~9h live) is ~430 calls — a busy weekend
# can exhaust a 1,000/month tier on its own. The quota check below is the
# guardrail: when a budget is hit, PropLine calls STOP (fail-closed, logged)
# instead of silently overrunning. Full-season live operation needs the
# Hobby tier or a slower poll — do NOT raise the pace without redoing this
# math and confirming the tier.
poll_seconds: 300
basketball_poll_seconds: 300  # stagger to save PropLine quota (see DESIGN §8)
max_stale_stats_seconds: 90

# PropLine quota budgets (quota.py). Both are hard stops: when either is hit,
# fetch_propline_props raises QuotaExceeded and the sport is skipped.
propline_daily_budget: 500
propline_monthly_budget: 1000

# Line anchor (Grok flaw 1): shrink the raw projection toward the CURRENT
# posted line before any edge is computed. 0.5 = model and market blended
# equally. 0.0 = anchor off (raw projection). See engine.anchor_projection.
line_anchor_weight: 0.5

# Rate-only rework (Grok flaw 5, pace-off-test-spec-2026-11-09): the live
# projection uses the live RATE at SEASON pace (pace ratio 1.0). false =
# rate-only (the rework, which beat season-average on fresh college data);
# true = the old live-pace projection. Set per the frozen test verdict.
use_live_pace: false

# Pregame prior (Grok flaw 2): the prior must be frozen BEFORE the game
# starts (runner.py --freeze-priors, run on a cron before the slate).
# true = reject any prior that was not frozen pregame (unless a priors.yaml
# override exists). Dry-run fixtures bypass this (they are pregame
# snapshots by construction).
require_pregame_prior: true

# Edge gates — ALL must pass, all sports to start
min_edge_pp: 0.07
min_ev: 0.05
line_stable_polls: 2
max_price_move_cents_against: 5

# Dedupe / limits — per sport
max_picks_per_game: 3
max_picks_per_slate_per_sport: 6

# Sizing
stake_mode: flat
flat_units: 0.5
kelly_fraction: 0.25
max_units: 1.0
bankroll_units: 100

# Per-sport settings
nfl:
  total_min: 60
  min_elapsed_minutes: 12
  no_pick_final_minutes: 2
  sd_inflation: 1.15
  season_plays_per_min: 1.05
  markets: [player_pass_yds, player_pass_tds, player_rush_yds, player_reception_yds, player_receptions, player_anytime_td]

ncaaf:
  total_min: 60
  min_elapsed_minutes: 10
  no_pick_final_minutes: 2
  sd_inflation: 1.35
  season_plays_per_min: 1.25  # college tempo is faster
  blowout_lead_skip: 28
  top30_file: top30_ncaaf.yaml
  markets: [player_pass_yds, player_pass_tds, player_rush_yds, player_reception_yds, player_receptions, player_anytime_td]

ncaab:
  total_min: 40
  min_elapsed_minutes: 8
  no_pick_final_minutes: 2
  sd_inflation: 1.25
  season_poss_per_min: 1.75  # ~70 poss / 40 min
  markets: [player_points, player_rebounds, player_assists, player_threes, player_points_rebounds, player_points_assists, player_rebounds_assists, player_points_rebounds_assists]

ncaaw:
  total_min: 40
  min_elapsed_minutes: 8
  no_pick_final_minutes: 2
  sd_inflation: 1.35
  season_poss_per_min: 1.70
  verify_propline_key_first: true  # do not assume basketball_ncaaw exists
  markets: [player_points, player_rebounds, player_assists, player_threes, player_points_rebounds, player_points_assists, player_rebounds_assists, player_points_rebounds_assists]

mode: log_only  # log_only | alert — never auto-bet
telegram_enabled: false
