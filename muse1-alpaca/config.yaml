# muse1/alpaca — Stock Bot, Experts + Hedge-Fund Overlay
# PAPER ONLY. Live trading is ALWAYS blocked in bot.py (--live exits 2).
name: muse1/alpaca
# UNVALIDATED: needs an out-of-sample backtest and a paper forward test
# before any live use. This bot MUST run on its OWN Alpaca paper account,
# separate from Brain — the VM .env must hold muse1-only paper keys
# (see DEPLOY.md). Running it on Brain's account is not supported.
# Version 0.3.0 (2026-11-05, Claude fix list round two): no-target
# signals submit entry+stop only (never a TP-at-entry bracket); swing
# uses its own 2R TP (day 2.5R no longer leaks in); Brooks/Dalton submit
# exactly the target they checked; a failed stop replace re-submits a
# standalone stop, verifies it, and blocks new trades while any position
# is unprotected; the duplicate check sees ALL broker positions and
# adopts unknown ones (VM copy adopts the MSFT short from the broker);
# VM schedule runs through 15:50 ET so the flatten happens.

paper: true
allow_live: false

# STRATEGY (frozen 2026-11-05, Claude fix list):
# min_reward_risk: Brooks range fade and Dalton value entries are refused
# unless reward / actual-stop-risk >= this. 1.5 is stricter than the
# locks' own reward>=risk (1.0) because round-trip costs eat the edge
# at 1.0. See experts.py _rr_ok().
strategy:
  min_reward_risk: 1.5

# ROLLOUT (frozen 2026-11-05, Claude fix list): ONE expert in log-only
# mode. raschke_soup is the only expert with a real-data record on two
# engines (Yahoo H1 PF 1.17-1.37; 10-year Dukascopy PF 1.02, n=1,941).
# live: [] — no expert places real orders yet. An expert moves to live
# only after a pre-registered backtest passes (PF >= 1 on validation
# and holdout, beats baseline and random, realistic costs).
rollout:
  log_only: [raschke_soup]
  live: []

# DATA (frozen 2026-11-05, Claude fix list): feed=iex explicitly,
# start/end bar requests (no bare limit=100), completed bars only.
data:
  feed: iex
  history_days_5min: 5
  history_days_daily: 90
  stale_bar_minutes: 30

